# Yungu LMS dashboard (owner's personal tool) — https://yungu.chihairou.dev → Next.js on 127.0.0.1:3000;
# the agent endpoint (/mcp) and its OAuth routes → the Yungu service on 127.0.0.1:8100.
# Separate from Home Hub (sites-enabled/home-hub); repo copy: /root/yungu-lms/frontend/deploy/nginx-yungu-lms.conf

server {
    listen 80;
    listen [::]:80;
    server_name yungu.chihairou.dev;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://yungu.chihairou.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yungu.chihairou.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yungu.chihairou.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yungu.chihairou.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads: 50 MB files + multipart overhead; the app enforces the exact limit.
    client_max_body_size 60m;

    # ---- Agents (MCP), on the Yungu service (127.0.0.1:8100). The consent page /oauth/authorize stays on
    # Next (location / below); the service's /oauth/authorize/request|approve are only reached through Next.
    # X-Real-IP is set from the connection, never passed through: the service throttles registrations by it.
    # The read-only MCP endpoint.
    location = /mcp {
        # Streamable HTTP: answers go out as they are written, and a call may wait on Yungu.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # A client that adds a slash: the endpoint itself (308 keeps the method and body).
    location = /mcp/ {
        return 308 /mcp;
    }
    # RFC 9728 metadata, at the root and the path-inserted /mcp form.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # RFC 8414 metadata.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # RFC 7591 dynamic client registration.
    location = /oauth/register {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Token endpoint.
    location = /oauth/token {
        # Codes, verifiers and refresh tokens travel in the body; nothing about them is logged.
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # RFC 7009 revocation.
    location = /oauth/revoke {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Todoist's OAuth redirect carries a one-use code and state in the query: never written to the access log.
    location = /api/todoist/callback {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Uploads to Yungu may take minutes (the app allows up to 5 min).
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_request_buffering off;
    }
}
