# Yungu LMS dashboard (owner's personal tool) — https://yungu.chihairou.dev → Next.js on 127.0.0.1:3000.
# Separate from Home Hub (sites-enabled/home-hub); repo copy: /root/yungu-lms/frontend/deploy/nginx-yungu-lms.conf

server {
    listen 80;
    listen [::]:80;
    server_name yungu.chihairou.dev;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://yungu.chihairou.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yungu.chihairou.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yungu.chihairou.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yungu.chihairou.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads: 50 MB files + multipart overhead; the app enforces the exact limit.
    client_max_body_size 60m;

    # Todoist's OAuth redirect carries a one-use code and state in the query: never written to the access log.
    location = /api/todoist/callback {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Uploads to Yungu may take minutes (the app allows up to 5 min).
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_request_buffering off;
    }
}
