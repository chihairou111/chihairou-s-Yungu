appId: dev.chihairou.yungu.local
productName: "chihairou's Yungu (local)"
asar: true
publish: null
directories:
  output: release
files:
  - dist/**/*
  - package.json
# The standalone Next server (resources/server/server.js) is copied whole, node_modules included, by
# scripts/after-pack.cjs: extraResources drops node_modules folders and trips on the symlinks Next leaves in them.
afterPack: scripts/after-pack.cjs
mac:
  target:
    - target: dmg
      arch: arm64
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  category: public.app-category.education
  extendInfo:
    NSCameraUsageDescription: To photograph your work for an assignment.
    NSMicrophoneUsageDescription: To record audio for an assignment.
